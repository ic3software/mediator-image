name: Build & Push Mediator Image

on:
  workflow_dispatch:
    inputs:
      mediator_version:
        description: "Mediator version"
        required: true
        default: "0.16.7"
      channel:
        description: "Moving tag to add (latest, nightly or main); empty for the immutable tag only"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mediator

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The segment is the immutable tag, always pushed. The channel is the
      # moving tag for the source that was built, and is added only when
      # build-release.sh passes one: a tagged build moves latest, a nightly
      # build moves nightly, a main build moves main, and a feature-branch
      # build moves nothing.
      - id: tags
        env:
          IMAGE: ghcr.io/${{ env.IMAGE_NAME }}
          VERSION: ${{ inputs.mediator_version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          tags="${IMAGE}:${VERSION}"
          if [ -n "$CHANNEL" ]; then
            tags="${tags},${IMAGE}:${CHANNEL}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: MEDIATOR_VERSION=${{ inputs.mediator_version }}
          tags: ${{ steps.tags.outputs.tags }}
